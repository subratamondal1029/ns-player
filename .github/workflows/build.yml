name: Build

on:
  pull_request:
    branches:
      - main
      - "dev/**"
    types:
      - closed

jobs:
  verify-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - id: check
        run: |
          version=$(scripts/ci-version-check.sh "${{ github.base_ref }}")
          echo "$version" >> "$GITHUB_OUTPUT"

  android-build:
    needs: verify-version
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: ./scripts/build-android.sh
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: build/android/ns-player.apk
          if-no-files-found: error

  web-build:
    needs: verify-version
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: ./scripts/build-web.sh
      - name: zip
        run: cd build/web && zip -r ../web.zip .
      - uses: actions/upload-artifact@v7
        with:
          name: web-dir
          path: build/web
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: web-zip
          path: build/web.zip
          if-no-files-found: error

  linux-build:
    needs: [verify-version, web-build]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/download-artifact@v7
        with:
          name: web-dir
          path: build/web
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: ./scripts/build-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: build/linux/NS-Player.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: server
          path: build/server/app-linux-amd64
          if-no-files-found: error
