name: release

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        run: |
          local_v=$(jq -r .version package.json)
          remote_v=$(git ls-remote --tags --refs origin 'v*' \
            | sed 's|.*refs/tags/v||' | sort -V | tail -n1)
          echo "local=$local_v remote=${remote_v:-none}"

          if [ -n "$remote_v" ]; then
            if [ "$local_v" = "$remote_v" ]; then
              echo "::error::Version $local_v is already released"; exit 1
            fi
            highest=$(printf '%s\n%s\n' "$remote_v" "$local_v" | sort -V | tail -n1)
            if [ "$highest" != "$local_v" ]; then
              echo "::error::Local $local_v is lower than remote $remote_v"; exit 1
            fi
          fi

          echo "version=$local_v" >> "$GITHUB_OUTPUT"

  android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: ./scripts/build-android.sh
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/android/ns-player.apk
          if-no-files-found: error

  web:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: ./scripts/build-web.sh
      - name: zip
        run: cd build/web && zip -r ../web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web-dir
          path: build/web
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: web-zip
          path: build/web.zip
          if-no-files-found: error

  linux:
    needs: [verify, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: web-dir
          path: build/web
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: ./scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/linux/NS-Player.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: build/server/app-linux-amd64
          if-no-files-found: error

  release:
    needs: [verify, android, web, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{android,web,linux,server}"
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.verify.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.verify.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*