name: Release

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  resolve-branch:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-26.04
    outputs:
      target_branch: ${{ steps.resolve.outputs.target_branch }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          target_branch=$(gh api \
            "/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
            -H "Accept: application/vnd.github+json" \
            --jq '.[0].base.ref // empty')

          if [[ -z "$target_branch" ]]; then
            echo "::error::Could not resolve the pull request base branch for workflow run $WORKFLOW_RUN_ID and commit $HEAD_SHA"
            exit 1
          fi

          echo "target_branch=$target_branch" >> "$GITHUB_OUTPUT"

  check-version:
    needs: resolve-branch
    if: >-
      ${{
        needs.resolve-branch.result == 'success' &&
        (
          needs.resolve-branch.outputs.target_branch == 'main' ||
          startsWith(needs.resolve-branch.outputs.target_branch, 'dev/')
        )
      }}
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      target_branch: ${{ steps.check.outputs.target_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: check
        env:
          TARGET_BRANCH: ${{ needs.resolve-branch.outputs.target_branch }}
        run: |
          version=$(scripts/ci-version-check.sh "$TARGET_BRANCH")
          echo "$version" >> "$GITHUB_OUTPUT"
          echo "target_branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"

  release:
    needs: check-version
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: "{android,web-zip,linux,server}"
          path: artifacts
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: v${{ needs.check-version.outputs.version }}
          prerelease: ${{ needs.check-version.outputs.target_branch != 'main' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
