name: PR Check

on:
  pull_request:
    branches:
      - main
      - "dev/**"

jobs:
  docs-check:
    runs-on: ubuntu-26.04
    outputs:
      docs_only: ${{ steps.docs.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: docs
        name: Check documentation-only changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: HEAD
          HEAD_REF: ${{ github.head_ref }}
        run: |
          docs_only=$(bash scripts/ci-docs-check.sh "$BASE_SHA" "$MERGE_SHA" "$HEAD_REF")
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  verify-version:
    needs: docs-check
    if: github.head_ref != 'docs' && needs.docs-check.outputs.docs_only == 'false'
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          version=$(scripts/ci-version-check.sh "$BASE_REF")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version check passed: $version"
